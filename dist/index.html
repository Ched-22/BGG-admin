<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bgg-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BGG Admin</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bgg-admin-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
            document.documentElement.style.colorScheme = t;
          } else {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-DwunVP5d.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Dr4zk7zN.css">
  </head>

  </body>
</html>
